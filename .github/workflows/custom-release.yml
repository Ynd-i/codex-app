# Paseo Custom releases for the Ynd-i/codex-app fork. See docs/release.md#custom-releases.
# Follows upstream Paseo stable releases only; nothing publishes while the branch is on an
# upstream beta.
# sync (scheduled): merge a newer upstream stable release, test, publish v<stable>-v1-beta1.
# beta (manual): test and publish the branch as the next v<stable>-v<N>-beta<M>.
# stable (manual): rebuild the latest beta's commit and publish it as v<stable>-v<N>.
name: Custom release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "sync: merge a newer upstream stable release; beta: release the branch; stable: promote the latest beta"
        type: choice
        options: [sync, beta, stable]
        default: sync

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: custom-release
  cancel-in-progress: false

env:
  BRANCH: codex-app
  UPSTREAM: https://github.com/getpaseo/paseo.git
  FEED_BRANCH: update-feed
  RCODESIGN_URL: https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/apple-codesign-0.29.0-macos-universal.tar.gz
  RCODESIGN_SHA256: d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d

jobs:
  plan:
    if: github.repository == 'Ynd-i/codex-app'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      backend: ${{ steps.plan.outputs.backend }}
      merge: ${{ steps.plan.outputs.merge }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      # Stable hotfixes can be cut off a release branch, so every upstream release tag counts.
      - name: Fetch upstream releases
        run: git fetch --no-tags "$UPSTREAM" "+refs/tags/v*:refs/tags/v*"

      - name: Plan
        id: plan
        run: node scripts/custom-release.mjs "${{ inputs.mode || 'sync' }}" | tee -a "$GITHUB_OUTPUT"

      - name: Merge upstream release
        if: steps.plan.outputs.merge != ''
        env:
          MERGE: ${{ steps.plan.outputs.merge }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit -m "chore: merge upstream Paseo $MERGE" "refs/tags/$MERGE"; then
            git diff --name-only --diff-filter=U | sed 's/^/- /' > conflicts.md
            { echo "Upstream $MERGE conflicts with $BRANCH; merge it by hand:"; cat conflicts.md; } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            exit 1
          fi
          # Tests and the build run on this commit; the branch moves only after they pass.
          git push --force origin "HEAD:refs/heads/custom-release/$MERGE"

      - name: Commit to release
        id: commit
        if: steps.plan.outputs.tag != ''
        env:
          FROM: ${{ steps.plan.outputs.from }}
        run: echo "sha=$(git rev-parse "$FROM^{commit}")" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: node scripts/npm-retry.mjs ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build:server
      - run: npm run typecheck
      - run: node --test scripts/custom-release.test.mjs
      - run: npm run test:unit --workspace=@getpaseo/server
      - run: npm run build:app-deps
      - run: npm run test --workspace=@getpaseo/app

  build:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: node scripts/npm-retry.mjs ci
      # The app version stays upstream's to match the bundled daemon; the in-app updater
      # compares this stamp instead.
      - name: Build Paseo Custom
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          VERSION: ${{ needs.plan.outputs.version }}
        run: npm run build:desktop:custom -- --arm64 --dir "-c.extraMetadata.paseoCustomUpdateVersion=$VERSION"
      # Squirrel.Mac installs an update only when it is signed by the same certificate as the
      # running app, so the self-signed certificate in these secrets must never change.
      # rcodesign signs with it without trusting it in a keychain, which codesign requires.
      - name: Point the app at the update feed and sign it
        env:
          P12: ${{ secrets.CUSTOM_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.CUSTOM_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::Set CUSTOM_SIGNING_P12 and CUSTOM_SIGNING_P12_PASSWORD; see docs/release.md#custom-releases"
            exit 1
          fi
          app="packages/desktop/release-custom/mac-arm64/Paseo Custom.app"
          printf 'provider: generic\nurl: https://raw.githubusercontent.com/%s/%s\nupdaterCacheDirName: paseo-custom-updater\n' \
            "$GITHUB_REPOSITORY" "$FEED_BRANCH" > "$app/Contents/Resources/app-update.yml"
          curl -fsSL -o rcodesign.tar.gz "$RCODESIGN_URL"
          echo "$RCODESIGN_SHA256  rcodesign.tar.gz" | shasum -a 256 -c -
          tar -xzf rcodesign.tar.gz --strip-components=1 apple-codesign-0.29.0-macos-universal/rcodesign
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          ./rcodesign sign --p12-file "$RUNNER_TEMP/signing.p12" --p12-password "$P12_PASSWORD" \
            --code-signature-flags runtime \
            --entitlements-xml-path packages/desktop/assets/entitlements.custom.mac.plist "$app"
          rm "$RUNNER_TEMP/signing.p12"
          codesign -v --strict --deep "$app"
      - name: Smoke-test the signed app
        env:
          PASEO_DESKTOP_EXPECT_CUSTOM: "1"
        run: node packages/desktop/e2e/packaged-app-smoke.js --app "packages/desktop/release-custom/mac-arm64/Paseo Custom.app"
      # Both downloads carry the smoke-tested app as signed, without packaging or signing it again.
      - name: Package the smoke-tested app as a dmg and a zip
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          app="packages/desktop/release-custom/mac-arm64/Paseo Custom.app"
          base="Paseo-Custom-$TAG-arm64"
          (cd packages/desktop && npx electron-builder --config electron-builder.custom.yml -c.mac.identity=null \
            --prepackaged "release-custom/mac-arm64/Paseo Custom.app" --mac dmg --arm64 --publish never)
          mv packages/desktop/release-custom/Paseo-Custom-*-arm64.dmg "$base.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$base.zip"
          for file in "$base.dmg" "$base.zip"; do
            shasum -a 256 "$file" > "$file.sha256"
          done
          cat > update-feed.yml <<EOF
          version: $VERSION
          files:
            - url: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$base.zip
              sha512: $(openssl dgst -sha512 -binary "$base.zip" | base64)
              size: $(stat -f %z "$base.zip")
          releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-custom
          path: |
            Paseo-Custom-*-arm64.*
            update-feed.yml

  publish:
    needs: [plan, test, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
      BACKEND: ${{ needs.plan.outputs.backend }}
      MERGE: ${{ needs.plan.outputs.merge }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance the branch to the merged upstream release
        if: env.MERGE != ''
        run: |
          git push origin "$SHA:refs/heads/$BRANCH"
          git push origin --delete "custom-release/$MERGE"
      - uses: actions/download-artifact@v4
        with:
          name: paseo-custom
      - name: Publish the GitHub release
        run: |
          base="Paseo-Custom-$TAG-arm64"
          cat > notes.md <<EOF
          Paseo Custom $TAG: the Codex-style macOS desktop on upstream Paseo [$BACKEND](https://github.com/getpaseo/paseo/releases/tag/$BACKEND).

          - Open the \`.dmg\` and drag Paseo Custom to Applications; the \`.zip\` holds the same app.
          - Apple Silicon only. Self-signed and not notarized: on first launch, right-click the app and choose Open, or run \`xattr -dr com.apple.quarantine "/Applications/Paseo Custom.app"\`.
          - Later releases install from inside the app. Betas reach only the beta release channel.
          - Runs its own daemon and home; it does not replace or update the official Paseo app.
          - Source: $SHA.
          - SHA-256: dmg \`$(cut -d' ' -f1 "$base.dmg.sha256")\`, zip \`$(cut -d' ' -f1 "$base.zip.sha256")\`
          EOF
          flags=()
          if [ "${{ needs.plan.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "$base.dmg" "$base.dmg.sha256" "$base.zip" "$base.zip.sha256" \
            --target "$SHA" --title "Paseo Custom $TAG" --notes-file notes.md "${flags[@]}"
      # The in-app updater reads beta-mac.yml on the beta channel and latest-mac.yml on stable.
      - name: Point the update feed at the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "origin/$FEED_BRANCH" >/dev/null; then
            git worktree add --detach feed "origin/$FEED_BRANCH"
          else
            git worktree add --orphan -b "$FEED_BRANCH" feed
          fi
          cp update-feed.yml feed/beta-mac.yml
          if [ "${{ needs.plan.outputs.prerelease }}" != "true" ]; then cp update-feed.yml feed/latest-mac.yml; fi
          git -C feed add -A
          git -C feed commit -m "Paseo Custom $TAG"
          git -C feed push origin "HEAD:refs/heads/$FEED_BRANCH"
      - name: Keep inherited upstream workflows disabled
        run: |
          gh workflow list --all --json path,state \
            --jq '.[] | select(.state == "active" and .path != ".github/workflows/custom-release.yml") | .path' |
            while read -r path; do gh workflow disable "$(basename "$path")"; done

  report-failure:
    needs: [plan, test, build, publish]
    if: failure()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open an issue for the failed release
        run: |
          title="Custom release ${{ needs.plan.outputs.tag || 'planning' }} failed"
          if [ -z "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "The release did not finish; check the run for which steps ran. Its summary lists any upstream merge conflicts. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
