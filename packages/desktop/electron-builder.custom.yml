# Keep upstream packaging inputs inherited.
extends: ./electron-builder.yml
appId: local.paseo.custom.desktop
productName: Paseo Custom
executableName: Paseo Custom
# Only the custom-release workflow adds an update feed, to the builds it publishes; see
# docs/release.md#custom-releases.
publish: null
# Object form replaces the parent protocol array; another array would concatenate it.
protocols:
  name: Paseo Custom agent link
  schemes:
    - paseo-custom
extraMetadata:
  productName: Paseo Custom
directories:
  output: release-custom
mac:
  artifactName: "Paseo-Custom-${version}-${arch}.${ext}"
  identity: "-"
  entitlements: assets/entitlements.custom.mac.plist
  entitlementsInherit: assets/entitlements.custom.mac.plist
  notarize: false
